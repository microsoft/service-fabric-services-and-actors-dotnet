name: build

on: 
  push:
    branches:
      - develop
      - 'release_*'
    
  pull_request:
    branches: 
    - develop
    - 'release_*'

env:
  DROP_DIR: drop

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@master
      - run: dotnet build buildAll.proj
      - uses: actions/upload-artifact@master
        with:
          name: build
          path: ${{ env.DROP_DIR }}

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v1
      - name: Disable strong name verification for testing
        shell: powershell
        run: .\SkipStrongName.ps1
      - name: Uninstall SF SDK assemblies from GAC
        shell: powershell
        # Run command in VS Dev shell
        run: |
          & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -SkipAutomaticLocation 
          .\UninstallSfSdkFromGac.ps1
      - run: dotnet test code.sln --configuration release --nologo --settings test\default.runsettings --results-directory ${{ env.DROP_DIR }} --logger trx
      - uses: actions/upload-artifact@master
        with:
          name: test-windows
          path: ${{ env.DROP_DIR }}

  test-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - run: dotnet test code.sln --configuration release --nologo --settings test/default.runsettings --results-directory ${{ env.DROP_DIR }} --logger trx
      - uses: actions/upload-artifact@master
        with:
          name: test-linux
          path: ${{ env.DROP_DIR }}
