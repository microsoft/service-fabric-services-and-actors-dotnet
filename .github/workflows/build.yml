name: build

on: 
  push:
    branches:
      - develop
      - 'release_*'
    
  pull_request:
    branches: 
    - develop
    - 'release_*'

permissions:
  contents: read

env:
  DROP_DIR: drop

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: dotnet build buildAll.proj
      - uses: actions/upload-artifact@master
        with:
          name: build
          path: ${{ env.DROP_DIR }}

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: .\SkipStrongName.ps1
      - run: .\UninstallSfSdkFromGac.ps1
      - run: dotnet test code.sln --configuration release --nologo --settings test\default.runsettings --results-directory ${{ env.DROP_DIR }} --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-windows
          path: ${{ env.DROP_DIR }}

  test-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: dotnet test code.sln --configuration release --nologo --settings test/default.runsettings --results-directory ${{ env.DROP_DIR }} --logger trx --framework net9.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-linux
          path: ${{ env.DROP_DIR }}
